<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha</title>
  <link rel="stylesheet" href="style/login.css">
</head>
<body>
  <main class="page">
    <section class="formLogin">
      <h1>Recuperar Senha</h1>
      <p>Digite o e-mail cadastrado para receber um link de redefinição de senha.</p>
      <form method="POST" action="../BackEnd/enviar_token.php"> 
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <input type="submit" value="Enviar Link" class="btn">
      </form>

      <nav>
        <a href="login.html">Voltar para login</a>
      </nav>
    </section>
  </main>
</body>

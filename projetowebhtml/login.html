<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style/login.css">
</head>
<body>
    <main class="page">
        <section class="formLogin" aria-label="Formulário de Login">
            <h1>
                <img src="img/iconelog.png" alt="Ícone de Login" class="icone-login">
                Login
            </h1>
            <p>Digite os seus dados de acesso no campo abaixo.</p>

            <form method="POST">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="Digite seu e-mail" required autofocus />

                <label for="password">Senha</label>
                <input id="password" name="password" type="password" placeholder="Digite sua senha" required />

                <a href="esqueci.html">Esqueci minha senha</a>

                <button type="submit" class="btn">Acessar</button>
            </form>
        </section>
    </main>
</body>
</html>
